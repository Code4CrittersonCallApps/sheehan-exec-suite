<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TAM · segment coverage · Critters on Call</title>
<style>
:root{
  --bg:#f7f8fb;
  --card:#ffffff;
  --line:#e6e9f0;
  --text:#121826;
  --muted:#6b7285;
  --dim:#9aa3b5;
  --accent:#2f6fed;
  --good:#0f9d6e;
  --track:#eef1f6;
  --bar:#2f6fed;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:880px;margin:0 auto;padding:36px 22px 72px}
.crumb{font-size:.78rem;color:var(--muted);margin:0 0 18px}
.crumb a{color:var(--muted);font-weight:600}
.crumb a:hover{color:var(--accent)}
header{margin:0 0 28px}
h1{
  margin:0;
  font-size:clamp(1.7rem,4vw,2.25rem);
  letter-spacing:-.03em;
  font-weight:750;
  color:var(--text);
}
.sub{margin:8px 0 0;color:var(--muted);font-size:.92rem;max-width:42rem}
.kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin:0 0 28px;
}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.kpis{grid-template-columns:1fr}}
.kpi{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px 16px 16px;
}
.kpi .l{
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:650;
}
.kpi .v{
  margin-top:8px;
  font-size:clamp(1.55rem,3.2vw,2.05rem);
  font-weight:750;
  letter-spacing:-.03em;
  line-height:1.05;
  color:var(--text);
}
.kpi .s{margin-top:6px;font-size:.75rem;color:var(--dim)}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:8px 4px 4px;
  overflow:hidden;
}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  padding:14px 18px 10px;
}
.panel-head h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.panel-head .note{font-size:.75rem;color:var(--dim)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 16px;text-align:left;vertical-align:middle}
th{
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  font-weight:650;
  border-bottom:1px solid var(--line);
  background:#fafbfd;
}
td{border-bottom:1px solid var(--line);font-size:.92rem}
tr:last-child td{border-bottom:0}
td.seg{font-weight:650;color:var(--text)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.muted{color:var(--muted);font-size:.88rem}
.cov{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  min-width:110px;
}
.cov .pct{font-variant-numeric:tabular-nums;font-weight:650;min-width:2.6rem;text-align:right}
.bar{
  width:64px;height:6px;border-radius:99px;background:var(--track);overflow:hidden;flex:0 0 auto;
}
.bar>i{display:block;height:100%;background:var(--bar);border-radius:99px}
.bar.phone>i{background:var(--good)}
.empty{padding:28px 18px;color:var(--muted);font-size:.92rem}
footer{margin-top:22px;font-size:.72rem;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <p class="crumb"><a href="index.html">Operator</a> · TAM reporting</p>
  <header>
    <h1>TAM by segment</h1>
    <p class="sub">Counts and coverage only. As of <span id="asof">—</span>.</p>
  </header>

  <section class="kpis" aria-label="TAM summary">
    <div class="kpi"><div class="l">Accounts</div><div class="v" id="k-accounts">—</div><div class="s">unique orgs</div></div>
    <div class="kpi"><div class="l">Contacts</div><div class="v" id="k-contacts">—</div><div class="s">named + list rows</div></div>
    <div class="kpi"><div class="l">Email coverage</div><div class="v" id="k-email">—</div><div class="s" id="k-email-s">—</div></div>
    <div class="kpi"><div class="l">Phone coverage</div><div class="v" id="k-phone">—</div><div class="s" id="k-phone-s">—</div></div>
    <div class="kpi"><div class="l">Customers</div><div class="v" id="k-cust">—</div><div class="s">matched in TAM</div></div>
  </section>

  <section class="panel" aria-label="Segments">
    <div class="panel-head">
      <h2>Segments</h2>
      <span class="note" id="seg-note">Loading…</span>
    </div>
    <div id="table-host"><p class="empty">Loading segment coverage…</p></div>
  </section>

  <footer id="foot">Source: data/bdr_tam_dialer.json</footer>
</div>
<script>
(function(){
  function fmt(n){
    if(n==null || isNaN(n)) return '—';
    return Number(n).toLocaleString('en-US');
  }
  function pct(n, d){
    if(!d) return 0;
    return Math.round(100 * n / d);
  }
  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function covCell(p, kind){
    var w = Math.max(0, Math.min(100, p|0));
    return '<div class="cov"><span class="pct">'+w+'%</span><span class="bar '+(kind||'')+'" aria-hidden="true"><i style="width:'+w+'%"></i></span></div>';
  }

  fetch('data/bdr_tam_dialer.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      var contacts = d.contacts || [];
      var by = {};
      var allAccts = {};
      var allCust = {};
      var emailN = 0, phoneN = 0;

      contacts.forEach(function(c){
        var seg = c.segment || 'Other';
        var ak = c.org_key || c.account || ('_'+Math.random());
        if(!by[seg]) by[seg] = {contacts:0, accounts:{}, customers:{}, email:0, phone:0};
        var b = by[seg];
        b.contacts++;
        b.accounts[ak] = 1;
        allAccts[ak] = 1;
        if(c.is_customer || c.customer_match){ b.customers[ak]=1; allCust[ak]=1; }
        if(c.has_email){ b.email++; emailN++; }
        if(c.has_phone){ b.phone++; phoneN++; }
      });

      var nContacts = contacts.length;
      var nAccounts = Object.keys(allAccts).length;
      var nCust = Object.keys(allCust).length;
      // Prefer file KPIs when present (stable published counts)
      var k = d.kpis || {};
      if(k.accounts) nAccounts = k.accounts;
      if(k.contacts) nContacts = k.contacts;
      if(k.with_email != null) emailN = k.with_email;
      if(k.with_phone != null) phoneN = k.with_phone;
      if(k.customers_matchable != null) nCust = k.customers_matchable;

      document.getElementById('asof').textContent = d.as_of || '—';
      document.getElementById('k-accounts').textContent = fmt(nAccounts);
      document.getElementById('k-contacts').textContent = fmt(nContacts);
      document.getElementById('k-email').textContent = pct(emailN, nContacts) + '%';
      document.getElementById('k-email-s').textContent = fmt(emailN) + ' with email';
      document.getElementById('k-phone').textContent = pct(phoneN, nContacts) + '%';
      document.getElementById('k-phone-s').textContent = fmt(phoneN) + ' with phone';
      document.getElementById('k-cust').textContent = fmt(nCust);

      var rows = Object.keys(by).map(function(seg){
        var b = by[seg];
        var accts = Object.keys(b.accounts).length;
        var custs = Object.keys(b.customers).length;
        return {
          seg: seg,
          accounts: accts,
          contacts: b.contacts,
          emailPct: pct(b.email, b.contacts),
          phonePct: pct(b.phone, b.contacts),
          customers: custs
        };
      }).sort(function(a,b){
        return b.accounts - a.accounts || b.contacts - a.contacts || a.seg.localeCompare(b.seg);
      });

      document.getElementById('seg-note').textContent = rows.length + ' segments';

      var html = '<table><thead><tr>'
        + '<th>Segment</th>'
        + '<th class="num">Accounts</th>'
        + '<th class="num">Contacts</th>'
        + '<th class="num">Email</th>'
        + '<th class="num">Phone</th>'
        + '<th class="num">Customers</th>'
        + '</tr></thead><tbody>';

      rows.forEach(function(r){
        html += '<tr>'
          + '<td class="seg">'+esc(r.seg)+'</td>'
          + '<td class="num">'+fmt(r.accounts)+'</td>'
          + '<td class="num muted">'+fmt(r.contacts)+'</td>'
          + '<td class="num">'+covCell(r.emailPct,'')+'</td>'
          + '<td class="num">'+covCell(r.phonePct,'phone')+'</td>'
          + '<td class="num">'+fmt(r.customers)+'</td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('table-host').innerHTML = html;

      document.getElementById('foot').textContent =
        'Source: data/bdr_tam_dialer.json · v'+(d.version||'?')+' · as of '+(d.as_of||'—')+' · reporting only';
    })
    .catch(function(err){
      document.getElementById('table-host').innerHTML =
        '<p class="empty">Could not load TAM data ('+esc(err.message)+').</p>';
      document.getElementById('seg-note').textContent = 'error';
    });
})();
</script>
</body>
</html>
